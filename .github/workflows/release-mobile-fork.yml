name: Repair Stirrup signing capability
on:
  workflow_dispatch:
    inputs:
      metadata_only:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/codex/stirrup-store-diagnostic' && inputs.metadata_only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Enable the required capability on the existing app only
        env:
          MOBILE_DISTRIBUTION_CONFIG: ${{ secrets.MOBILE_DISTRIBUTION_CONFIG }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          node --input-type=module <<'JS'
          import { createPrivateKey, sign } from 'node:crypto';
          let stage = 'credentials';
          try {
            const config = JSON.parse(process.env.MOBILE_DISTRIBUTION_CONFIG);
            const appId = config.appStoreConnectAppId;
            if (!/^\d+$/.test(appId)) throw new Error();
            const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
            const now = Math.floor(Date.now()/1000);
            const payload = `${encode({alg:'ES256',kid:process.env.APPLE_API_KEY_ID,typ:'JWT'})}.${encode({iss:process.env.APPLE_API_ISSUER,iat:now,exp:now+600,aud:'appstoreconnect-v1'})}`;
            const pem = process.env.APPLE_API_KEY_P8;
            const key = createPrivateKey(pem.includes('BEGIN PRIVATE KEY') ? pem : Buffer.from(pem,'base64'));
            const signature = sign('sha256',Buffer.from(payload),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
            const token = `${payload}.${signature}`;
            async function read(path, resource, update) {
              stage = resource;
              const response = await fetch(`https://api.appstoreconnect.apple.com/v1/${path}`,{method:update?'POST':'GET',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},...(update?{body:JSON.stringify(update)}:{}),signal:AbortSignal.timeout(30000)});
              const body = await response.json();
              if (!response.ok) {
                const codes = (body.errors ?? []).map(e=>e.code).filter(c=>typeof c==='string' && /^[A-Z0-9_.-]+$/.test(c));
                console.log(JSON.stringify({resource,status:response.status,codes}));
                throw new Error();
              }
              return body.data;
            }
            const app = await read(`apps/${encodeURIComponent(appId)}`, 'existingApp');
            if (app.attributes.bundleId !== config.bundleIdentifier) throw new Error();
            const ids = await read(`bundleIds?filter[identifier]=${encodeURIComponent(config.bundleIdentifier)}&limit=200`, 'existingBundle');
            console.log(JSON.stringify({resource:'existingBundle',count:ids.length,exactMatches:ids.filter(b=>b.attributes.identifier===config.bundleIdentifier).length}));
            const exact = ids.filter(b=>b.attributes.identifier === config.bundleIdentifier);
            if (exact.length !== 1) throw new Error();
            const id = exact[0].id;
            const caps = await read(`bundleIds/${encodeURIComponent(id)}/bundleIdCapabilities`, 'capabilities');
            if (!caps.some(c => c.attributes.capabilityType === 'APPLE_ID_AUTH')) {
              await read('bundleIdCapabilities', 'enableAppleSignIn', {data:{type:'bundleIdCapabilities',attributes:{capabilityType:'APPLE_ID_AUTH',settings:[{key:'TIBURON_APP_CONSENT',options:[{key:'PRIMARY_APP_CONSENT',enabled:true}]}]},relationships:{bundleId:{data:{type:'bundleIds',id}}}}});
              console.log('Enabled Sign in with Apple for the verified existing app.');
            } else console.log('Sign in with Apple was already enabled.');
            const verified = await read(`bundleIds/${encodeURIComponent(id)}/bundleIdCapabilities`, 'verifyCapability');
            if (!verified.some(c => c.attributes.capabilityType === 'APPLE_ID_AUTH')) throw new Error();
            console.log('Required capability verified.');
          } catch {
            console.error(`Signing capability repair stopped at ${stage}.`);
            process.exitCode = 1;
          }
          JS
