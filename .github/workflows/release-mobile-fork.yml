name: Inspect Stirrup beta build
on:
  workflow_dispatch:
    inputs:
      metadata_only:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/codex/stirrup-store-diagnostic' && inputs.metadata_only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Read processing and TestFlight state of the existing build
        env:
          MOBILE_DISTRIBUTION_CONFIG: ${{ secrets.MOBILE_DISTRIBUTION_CONFIG }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          node --input-type=module <<'JS'
          import { createPrivateKey, sign } from 'node:crypto';
          let stage = 'credentials';
          try {
            const config = JSON.parse(process.env.MOBILE_DISTRIBUTION_CONFIG);
            const appId = config.appStoreConnectAppId;
            if (!/^\d+$/.test(appId)) throw new Error();
            const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
            const now = Math.floor(Date.now()/1000);
            const payload = `${encode({alg:'ES256',kid:process.env.APPLE_API_KEY_ID,typ:'JWT'})}.${encode({iss:process.env.APPLE_API_ISSUER,iat:now,exp:now+600,aud:'appstoreconnect-v1'})}`;
            const pem = process.env.APPLE_API_KEY_P8;
            const key = createPrivateKey(pem.includes('BEGIN PRIVATE KEY') ? pem : Buffer.from(pem,'base64'));
            const signature = sign('sha256',Buffer.from(payload),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
            const token = `${payload}.${signature}`;
            async function read(path, resource) {
              stage = resource;
              const response = await fetch(`https://api.appstoreconnect.apple.com/v1/${path}`,{method:'GET',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},signal:AbortSignal.timeout(30000)});
              const body = await response.json();
              if (!response.ok) {
                const codes = (body.errors ?? []).map(e=>e.code).filter(c=>typeof c==='string' && /^[A-Z0-9_.-]+$/.test(c));
                const pointers = (body.errors ?? []).map(e=>e.source?.pointer).filter(p=>typeof p==='string' && /^\/data\/[a-zA-Z0-9_/-]+$/.test(p));
                console.log(JSON.stringify({resource,status:response.status,codes,pointers}));
                throw new Error();
              }
              return body.data;
            }
            const app = await read(`apps/${encodeURIComponent(appId)}`, 'existingApp');
            if (app.attributes.bundleId !== config.bundleIdentifier) throw new Error();
            console.log(JSON.stringify({listingNameMatches:app.attributes.name==='Stirrup by SaddleTree'}));
            const builds = await read(`apps/${encodeURIComponent(appId)}/builds`, 'appBuilds');
            const selected = builds.filter(build=>build.attributes.version==='13');
            if (selected.length !== 1) throw new Error();
            const build = selected[0];
            const release = await read(`builds/${encodeURIComponent(build.id)}/preReleaseVersion`, 'releaseVersion');
            if (release.attributes.version !== '1.0.13') throw new Error();
            const beta = await read(`builds/${encodeURIComponent(build.id)}/buildBetaDetail`, 'betaState');
            const states = [build.attributes.processingState, beta.attributes.internalBuildState, beta.attributes.externalBuildState];
            if (!states.every(value=>typeof value==='string' && /^[A-Z_]+$/.test(value))) throw new Error();
            console.log(JSON.stringify({version:release.attributes.version,build:build.attributes.version,processingState:states[0],internalBuildState:states[1],externalBuildState:states[2],expired:build.attributes.expired}));
          } catch {
            console.error(`Beta build inspection stopped at ${stage}.`);
            process.exitCode = 1;
          }
          JS
