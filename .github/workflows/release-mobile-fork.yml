name: Update Stirrup store metadata
on:
  workflow_dispatch:
    inputs:
      metadata_only:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/codex/stirrup-store-diagnostic' && inputs.metadata_only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Update the existing editable listing and report safe error codes
        env:
          MOBILE_DISTRIBUTION_CONFIG: ${{ secrets.MOBILE_DISTRIBUTION_CONFIG }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          node --input-type=module <<'JS'
          import { createPrivateKey, sign } from 'node:crypto';
          let stage = 'credentials';
          try {
            const appId = JSON.parse(process.env.MOBILE_DISTRIBUTION_CONFIG).appStoreConnectAppId;
            if (!/^\d+$/.test(appId)) throw new Error();
            const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
            const now = Math.floor(Date.now()/1000);
            const payload = `${encode({alg:'ES256',kid:process.env.APPLE_API_KEY_ID,typ:'JWT'})}.${encode({iss:process.env.APPLE_API_ISSUER,iat:now,exp:now+600,aud:'appstoreconnect-v1'})}`;
            const pem = process.env.APPLE_API_KEY_P8;
            const key = createPrivateKey(pem.includes('BEGIN PRIVATE KEY') ? pem : Buffer.from(pem,'base64'));
            const signature = sign('sha256',Buffer.from(payload),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
            const token = `${payload}.${signature}`;
            async function read(path, resource, update) {
              stage = resource;
              const response = await fetch(`https://api.appstoreconnect.apple.com/v1/${path}`,{method:update?'PATCH':'GET',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},...(update?{body:JSON.stringify(update)}:{}),signal:AbortSignal.timeout(30000)});
              const body = await response.json();
              if (!response.ok) {
                const codes = (body.errors ?? []).map(e=>e.code).filter(c=>typeof c==='string' && /^[A-Z0-9_.-]+$/.test(c));
                console.log(JSON.stringify({resource,status:response.status,codes}));
                throw new Error();
              }
              return body.data;
            }
            const infos = await read(`apps/${encodeURIComponent(appId)}/appInfos?limit=200`,'appInfos');
            console.log(JSON.stringify({resource:'appInfos',states:infos.map(i=>({appStoreState:i.attributes.appStoreState,state:i.attributes.state}))}));
            for (const info of infos) {
              const locales = await read(`appInfos/${encodeURIComponent(info.id)}/appInfoLocalizations?limit=200`,'appInfoLocalizations');
              if (info.attributes.appStoreState === 'PREPARE_FOR_SUBMISSION') {
                for (const locale of locales) {
                  if (locale.attributes.name === 'Stirrup' && locale.attributes.privacyPolicyUrl === 'https://saddletree.ai/privacy') continue;
                  await read(`appInfoLocalizations/${encodeURIComponent(locale.id)}`, 'updateLocalization', {data:{type:'appInfoLocalizations',id:locale.id,attributes:{name:'Stirrup',privacyPolicyUrl:'https://saddletree.ai/privacy'}}});
                  console.log('Updated one existing localization.');
                }
              }
              console.log(JSON.stringify({resource:'appInfoLocalizations',state:info.attributes.appStoreState,count:locales.length,namedStirrup:locales.filter(l=>l.attributes.name==='Stirrup').length,companyPrivacy:locales.filter(l=>l.attributes.privacyPolicyUrl==='https://saddletree.ai/privacy').length}));
            }
            const versions = await read(`apps/${encodeURIComponent(appId)}/appStoreVersions?limit=200`,'appStoreVersions');
            console.log(JSON.stringify({resource:'appStoreVersions',versions:versions.map(v=>({platform:v.attributes.platform,state:v.attributes.appStoreState,version:v.attributes.versionString}))}));
          } catch {
            console.error(`Metadata update stopped at ${stage}.`);
            process.exitCode = 1;
          }
          JS
